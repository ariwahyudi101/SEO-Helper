[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-audit"
version = "0.1.0"
description = "Production-ready SEO and GEO audit CLI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "SEO Helper"}]
dependencies = [
  "typer>=0.12.3",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.1",
  "python-dateutil>=2.9.0.post0",
  "rich>=13.7.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
seo-audit = "seo_audit.cli:app"

[tool.setuptools.packages.find]
include = ["seo_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
